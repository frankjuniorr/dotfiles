---
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true

- name: "GIT | Read email from vault"
  ansible.builtin.shell: op read "op://Personal/GitHub/email"
  register: github_email
  changed_when: false
  when: op_installed
  tags: [configs]

- name: "GIT | Read ssh key from vault"
  ansible.builtin.shell: op read "op://Personal/GitHub SSH/public key"
  register: github_ssh_public_key
  changed_when: false
  when: op_installed
  tags: [configs]

- name: "GIT | Ensure directories structure exists"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ ansible_facts.user_dir }}/.config/lazygit"
    - "{{ ansible_facts.user_dir }}/.config/git"
  tags: [configs]

- name: "GIT | Copy the credential file"
  ansible.builtin.template:
    src: "git-credentials-personal.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/git/.git-credentials-personal"
  when: op_installed
  tags: [configs]

- name: "GIT | Create symbolic links"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { src: "{{ role_path }}/files/template", dest: "{{ ansible_facts.user_dir }}/.config/git/template" }
  tags: [configs]

# Omarchy ships its own ~/.config/git/config and ~/.config/lazygit/config.yml,
# refreshed by omarchy-refresh-config/omarchy-reinstall-configs. Overwriting
# either breaks on the next refresh. Compose instead of clobbering: our config
# lives at config.personal and gets included from Omarchy's config; lazygit is
# ceded entirely (Omarchy's default is fine and untouched by migrations).
- name: "GIT | Symlink personal config (omarchy_mode)"
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.personal"
    dest: "{{ ansible_facts.user_dir }}/.config/git/config.personal"
    state: link
    force: yes
  when: omarchy_mode | default(false)
  tags: [configs]

- name: "GIT | Compose with Omarchy's git config (omarchy_mode)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.user_dir }}/.config/git/config"
    marker: "# {mark} dotfiles — personal include"
    block: |
      [include]
          path = {{ ansible_facts.user_dir }}/.config/git/config.personal
    create: yes
  when: omarchy_mode | default(false)
  tags: [configs]

- name: "GIT | Symlink full config (non-omarchy)"
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.personal"
    dest: "{{ ansible_facts.user_dir }}/.config/git/config"
    state: link
    force: yes
  when: not (omarchy_mode | default(false))
  tags: [configs]

- name: "GIT | Symlink lazygit config (non-omarchy)"
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.yml"
    dest: "{{ ansible_facts.user_dir }}/.config/lazygit/config.yml"
    state: link
    force: yes
  when: not (omarchy_mode | default(false))
  tags: [configs]