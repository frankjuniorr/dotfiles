---
# script -qec gives yay's internal sudo call a tty to read the primed ticket
# from — see the google-chrome role for the full explanation.
- name: "TFENV | Install"
  ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && yay -S --needed --noconfirm tfenv' /dev/null"
  no_log: true

- name: "TFENV | Add to group"
  become: true
  ansible.builtin.user:
    append: true
    groups: tfenv
    name: "{{ ansible_facts.user_id }}"