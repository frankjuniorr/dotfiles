---
# Omarchy 4.0 defaults to `foot` (xdg-terminal-exec + theming) — no Archlinux.yaml
# here on purpose, so this role stays a no-op on Arch/Omarchy (Decision #7 in the
# migration plan). It only does anything on Ubuntu (terminator).
# `configs` is intrinsically tagged on this dispatcher because the config symlink
# lives inside Ubuntu.yaml, mixed with the install step.
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true
  tags: [configs]

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true
  tags: [configs]