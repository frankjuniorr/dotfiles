---
- name: "LAZYGIT | Get the latest version"
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
    return_content: yes
  register: lazygit_release_info

- name: "LAZYGIT | Extract version from API response"
  ansible.builtin.set_fact:
    lazygit_version: "{{ lazygit_release_info.json.tag_name | regex_replace('^v', '') }}"

- name: "LAZYGIT | Download binary"
  ansible.builtin.get_url:
    url: "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
    dest: /tmp/lazygit.tar.gz

- name: "LAZYGIT | Extract binary"
  ansible.builtin.unarchive:
    src: /tmp/lazygit.tar.gz
    dest: /tmp
    creates: /tmp/lazygit

- name: "LAZYGIT | Install binary"
  become: true
  ansible.builtin.copy:
    src: /tmp/lazygit
    dest: /usr/local/bin/lazygit
    mode: '0755'
    owner: "{{ host_user }}"
    group: "{{ host_user }}"
    force: true

- name: "LAZYGIT | Cleanup"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/lazygit.tar.gz
    - /tmp/lazygit

# --- git-delta ---
- name: "GIT-DELTA | Install"
  become: true
  ansible.builtin.apt:
    name: git-delta
    state: present

# --- meld ---
- name: "MELD | Install"
  become: true
  ansible.builtin.apt:
    name: meld
    state: present

# --- github-cli ---
# gh is in the mise registry (priority: mise > apt), and apt_key is gone on Ubuntu 26.04.
- name: "GH CLI | Install via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [gh]
