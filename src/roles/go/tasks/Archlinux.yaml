---
# go comes from mise on every host (Omarchy provisions languages via mise too;
# `omarchy-install-dev-env go` is a thin wrapper around `mise use --global go@latest`).
- name: "GO | Archlinux | Install go via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [go]
