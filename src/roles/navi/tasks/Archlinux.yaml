---
- name: "NAVI | Install"
  become: true
  community.general.pacman:
    name: navi
    state: present
  when: not (omarchy_mode | default(false))

- name: "NAVI | Install via Omarchy CLI"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/omarchy_pkg.yml"
  vars:
    omarchy_pkg_names: [navi]
