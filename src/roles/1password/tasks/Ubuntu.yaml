---
# apt-key was removed in Ubuntu 26.04 (so ansible's apt_key fails there) and
# apt_repository is deprecated: use deb822_repository, which fetches and stores
# the signing key itself. It needs python3-debian on the target.
- name: "1Password | Install python3-debian (for deb822_repository)"
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: "1Password | Add APT Repo"
  ansible.builtin.deb822_repository:
    name: 1password
    types: [deb]
    uris: "https://downloads.1password.com/linux/debian/{{ ansible_facts.machine | replace('x86_64', 'amd64') }}"
    suites: [stable]
    components: [main]
    architectures: ["{{ ansible_facts.machine | replace('x86_64', 'amd64') }}"]
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
    state: present
  become: true

- name: "1Password | Add debsig-verify policy"
  become: true
  block:
    - name: "1Password | Ensure policy directory exists"
      ansible.builtin.file:
        name: /etc/debsig/policies/AC2D62742012EA22
        state: directory
        mode: "0755"

    - name: "1Password | Copy debsig-verify policy"
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/debian/debsig/1password.pol
        dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
        mode: "0644"

    - name: "1Password | Ensure debsig keyring directory exists"
      ansible.builtin.file:
        name: /usr/share/debsig/keyrings/AC2D62742012EA22
        state: directory
        mode: "0755"

    - name: "1Password | Download signing key"
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/keys/1password.asc
        dest: /tmp/1password.asc
        mode: "0644"

    - name: "1Password | Add debsig keyring"
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg /tmp/1password.asc
        creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

    - name: "1Password | Remove downloaded key"
      ansible.builtin.file:
        path: /tmp/1password.asc
        state: absent

- name: "1Password | Install 1Password"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - 1password-cli
    - 1password
  become: true