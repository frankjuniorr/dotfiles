---
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists


- name: "DOTFILES | Refresh folders"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ scripts_installation_path }}"
    - "{{ ansible_facts.user_dir }}/.config/dotfiles/"
  tags: [configs]


- name: "DOTFILES | Ensure directory structure exists"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ scripts_installation_path }}"
    - "{{ ansible_facts.user_dir }}/.config/dotfiles/"
  tags: [configs]

- name: "DOTFILES | Create symbolic link for all alias"
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ ansible_facts.user_dir }}/.config/dotfiles/{{ item | basename }}"
    state: link
    force: yes
  with_fileglob:
    - "{{ role_path }}/files/alias/*"
  tags: [configs]


- name: "DOTFILES | Ensure that all the commands have execution permission"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  with_fileglob:
    - "{{ role_path }}/files/commands/*"
  tags: [configs]

- name: "DOTFILES | Create symbolic links for commands"
  ansible.builtin.file:
    src: "{{ role_path }}/files/commands"
    dest: "{{ scripts_installation_path }}"
    state: link
    mode: "0755"
    force: yes
  tags: [configs]

- name: "DOTFILES | Ensure dotfiles binary is executable"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../bin/dotfiles"
    mode: '0755'
  tags: [configs]

- name: "DOTFILES | Create symbolic link for dotfiles binary"
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../bin/dotfiles"
    dest: "{{ primary_installation_path }}/dotfiles"
    state: link
    force: yes
  tags: [configs]

- name: "DOTFILES | generate private environment variables"
  ansible.builtin.template:
    src: "private-env.sh.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/dotfiles/private-env.sh"
  when: vault_github_token is defined
  tags: [configs]

- name: "DOTFILES | Ensure systemd user directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/systemd/user"
    mode: "0755"
    state: directory
  tags: [configs]

- name: "DOTFILES | Symlink headphone-autoconnect service"
  ansible.builtin.file:
    src: "{{ role_path }}/files/systemd/headphone-autoconnect.service"
    dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/headphone-autoconnect.service"
    state: link
    force: yes
  tags: [configs]

- name: "DOTFILES | Enable headphone-autoconnect service"
  ansible.builtin.systemd:
    name: headphone-autoconnect.service
    enabled: yes
    scope: user
    daemon_reload: yes
  when: not (is_docker_build | default(false))
  tags: [configs]
