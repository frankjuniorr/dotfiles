---
# Replaces the `hyde` role on Omarchy hosts. Uses the Omarchy CLI wrappers instead of
# raw pacman/yay so the integrations Omarchy manages itself (xdg-settings, .desktop
# files, theming) stay intact. Only runs with `--mode omarchy` (omarchy_mode=true) —
# on any other Arch host this role is a no-op.
- name: "OMARCHY | Setup"
  when: omarchy_mode | default(false)
  block:
    # `omarchy-remove-browser` no longer accepts "chromium" as a target (rolling
    # release drift since the migration was first audited against 4.0.0.alpha —
    # chromium is now an internal fallback, not something you remove). The
    # current flow is install + set-default instead, via omarchy-default-browser.
    #
    # yay's own internal `sudo pacman -U` needs a real tty to prompt for a
    # password — Ansible detaches shell/command tasks from any controlling tty,
    # so a bare `sudo` call inside a wrapped command always fails with "a
    # password is required", no matter how recently sudo -v was run beforehand
    # (that ticket lives on a different tty and isn't visible here). `script`
    # allocates a pty for the whole wrapped command so the prime (piped in via
    # stdin) and the later privileged use share the same tty — same technique
    # Omarchy's own omarchy-update script uses.
    - name: "OMARCHY | Install Google Chrome"
      ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && omarchy-install-browser chrome' /dev/null"
      args:
        creates: /usr/bin/google-chrome-stable
      no_log: true

    # omarchy-default-browser is unprivileged (xdg-settings/xdg-mime only) —
    # doesn't need the script/sudo wrapping above.
    - name: "OMARCHY | Set Google Chrome as default browser"
      ansible.builtin.shell: "omarchy-default-browser chrome"
      changed_when: true

    # omarchy-update calls `omarchy-hook post-update`, which runs everything in
    # this directory (Omarchy itself ships a `.sample` file here — skipped by
    # omarchy-hook, harmless to sit next to). Symlinked (not omarchy-hook-install's
    # `cp`) so it stays live and self-updating on `git pull`, like every other
    # config in this repo. Needs the `configs` tag (T6) to exist first.
    - name: "OMARCHY | Ensure post-update hooks directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/omarchy/hooks/post-update.d"
        state: directory
        mode: "0755"
      tags: [configs]

    - name: "OMARCHY | Install post-update hook to reapply dotfiles symlinks"
      ansible.builtin.file:
        src: "{{ role_path }}/files/hooks/10-dotfiles-reapply"
        dest: "{{ ansible_facts.user_dir }}/.config/omarchy/hooks/post-update.d/10-dotfiles-reapply"
        state: link
        force: yes
      tags: [configs]

    # Omarchy "Quattro" (v4.0, confirmed against the real v4.0.0 tag) made the
    # Lua Hyprland config (`hyprland.lua` entry point requiring hypr.monitors/
    # input/bindings/looknfeel/autostart) the stable default — the old
    # hyprlang `.conf` era (see git history around commit 7fed51b for why this
    # role briefly reverted to `.conf` while `dev` was ahead of `stable`) is
    # over on any current install. looknfeel.lua/monitors_*.lua content below
    # is recovered from that pre-revert commit (7fed51b^) rather than
    # rewritten from scratch, since it was already real Omarchy `dev`-branch
    # syntax that `stable` has now caught up to — values (rounding=8, the same
    # host/VM monitor layouts) were diffed against the `.conf` files being
    # replaced here and confirmed unchanged.
    #
    # hypridle.conf has no `.lua` equivalent to symlink: Omarchy Quattro
    # deleted the file outright (hyprlock/hypridle/waybar/mako/swayosd/swaybg/
    # polkit-gnome all absorbed into a single Quickshell process). Idle/lock
    # timeouts now live in `~/.config/omarchy/shell.json`'s `idle` key
    # (`{"screensaver": 150, "lock": 300}`) — no role manages that file today;
    # add one if/when idle timeout customization is actually needed.
    #
    # ~/.config/hypr is populated by Omarchy at install time, but its
    # automated update pipeline (omarchy-update -> omarchy-migrate) never
    # touches these specific files today — only the manual, confirmation-gated
    # "reset Hyprland to defaults" action (omarchy-refresh-hyprland, exposed in
    # omarchy-menu) does. Symlinking them here is safe: no silent clobber risk
    # like fastfetch/git/btop.
    - name: "OMARCHY | Symlink looknfeel.lua"
      ansible.builtin.file:
        src: "{{ role_path }}/files/hypr/looknfeel.lua"
        dest: "{{ ansible_facts.user_dir }}/.config/hypr/looknfeel.lua"
        state: link
        force: yes
      tags: [configs]

    # monitors.lua is host-specific (resolution/position differ per machine),
    # so pick the right source the same way the old `hyde` role did for its
    # monitors_host.conf/monitors_vm.conf pair (values carried over unchanged).
    - name: "OMARCHY | Detect system: VM or Host"
      ansible.builtin.shell: systemd-detect-virt
      register: omarchy_virt_type
      changed_when: false
      ignore_errors: yes
      tags: [configs]

    - name: "OMARCHY | Symlink monitors.lua"
      ansible.builtin.file:
        src: "{{ role_path }}/files/hypr/{{ 'monitors_vm.lua' if omarchy_virt_type.stdout != 'none' else 'monitors_host.lua' }}"
        dest: "{{ ansible_facts.user_dir }}/.config/hypr/monitors.lua"
        state: link
        force: yes
      tags: [configs]

    # bindings.lua is confirmed (manual/31-dotfiles.md) to be entirely ours —
    # unlike the old hyprlang bindings.conf, no Quattro migration was found
    # editing this path, so Omarchy itself never writes here. Still composed
    # via blockinfile rather than a pure symlink: that's a deliberate,
    # not-yet-settled choice (task T18d) pending live confirmation on a real
    # Quattro machine that no future migration ever touches this file either —
    # switch to a plain symlink once that's confirmed, not before.
    # o.bind(combo, description, command) is the confirmed Lua keybind API
    # (Omarchy - Keybindings.md, sourced from default/hypr/bindings/*.lua).
    # Opens the sesh picker (~/.bin/__sesh_start, symlinked by the dotfiles
    # role) from anywhere, not just from an already-open shell — complements
    # the zsh zle widget in the dotfiles role's sesh.sh, which only fires once
    # a zsh prompt already exists. xdg-terminal-exec resolves whichever
    # terminal is actually configured, same mechanism Omarchy's own Tmux bind
    # (SUPER ALT, RETURN) uses.
    - name: "OMARCHY | Compose sesh keybind into native bindings.lua"
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.user_dir }}/.config/hypr/bindings.lua"
        marker: "-- {mark} dotfiles — personal bindings"
        block: |
          o.bind("SUPER + ALT + S", "Sesh picker", "uwsm-app -- xdg-terminal-exec --dir=\"$(omarchy-cmd-terminal-cwd)\" {{ ansible_facts.user_dir }}/.bin/__sesh_start")
        create: yes
      tags: [configs]
