---
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true

# Tagged `configs` directly on the include (not just inherited) so these stay
# reachable under --tags configs — each file mixes install and symlink tasks,
# and per-task tags inside decide what actually runs.
- name: "Tmux | Run tmux tasks"
  ansible.builtin.include_tasks: tmux.yaml
  tags: [configs]

- name: "Tmux | Run tmuxinator tasks"
  ansible.builtin.include_tasks: tmuxinator.yaml
  tags: [configs]

- name: "Tmux | Run systemd user service tasks"
  ansible.builtin.include_tasks: systemd.yaml
  tags: [configs]
