---
# starship comes from mise (see roles/mise). Omarchy already ships it via pacman, so skip there.
- name: "STARSHIP | Install via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [starship]
  when: not (omarchy_mode | default(false))
