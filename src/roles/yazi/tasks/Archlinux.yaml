---
# yazi, glow and ripgrep come from mise; the preview deps below are system
# packages/libraries (no mise equivalent) and stay on pacman.
- name: "YAZI | Install yazi, glow, ripgrep via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [yazi, glow, ripgrep]

- name: "YAZI | Install preview dependencies"
  become: true
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - 7zip
    - poppler
    - ueberzugpp
  when: not (omarchy_mode | default(false))

- name: "YAZI | Install preview dependencies via Omarchy CLI"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/omarchy_pkg.yml"
  vars:
    omarchy_pkg_names: [7zip, poppler, ueberzugpp]
