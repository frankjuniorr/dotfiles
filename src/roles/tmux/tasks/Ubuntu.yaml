---
- name: "Tmux | Ubuntu | Install tmux via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [tmux]

# tmuxinator is a Ruby gem with no mise registry entry — stays on apt.
- name: "Tmux | Ubuntu | Install tmuxinator"
  become: true
  ansible.builtin.apt:
    name: tmuxinator
    state: present
