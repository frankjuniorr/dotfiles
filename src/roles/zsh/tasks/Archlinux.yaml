---
- name: "ZSH | Archlinux | Install zsh"
  become: true
  community.general.pacman:
    name: zsh
    state: present
  when: not (omarchy_mode | default(false))

- name: "ZSH | Archlinux | Install zsh via Omarchy CLI"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/omarchy_pkg.yml"
  vars:
    omarchy_pkg_names: [zsh]
