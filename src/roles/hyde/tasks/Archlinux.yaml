---

# CONFIGURE PACKAGE MANAGERS
#######################################################################################
# To enable auto pasting, we can emulate  ctrl v (pasting) shortcut.
# more info here: https://github.com/HyDE-Project/HyDE/discussions/137#discussioncomment-11952405
- name: "HYDE | Install some packages"
  become: true
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - wtype

- name: "HYDE | Install some AUR packages"
  become: true
  ansible.builtin.shell: yay -S --needed --noconfirm --answerclean None --answerdiff None --answeredit None {{ item }}
  loop:
    - visual-studio-code-bin


# CONFIGURE PACKAGE MANAGERS
#######################################################################################
- name: "HYDE | Remove yay installation folder"
  ansible.builtin.file:
   path: "{{ ansible_facts.user_dir }}/Clone"
   state: absent

# ILoveCandy is now disabled by the system-base role (runs on every Arch mode,
# not just hyde) — no need to duplicate it here.

# CONFIGURE HYPRLAND (Lua config, HyDE >= the Lua migration)
#######################################################################################
# HyDE moved Hyprland's user-facing config from a set of sourced .conf files to
# a single ~/.config/hypr/hyprland.lua (see ~/HyDE/MIGRATION-LUA.md). None of the
# old .conf files (userprefs.conf, windowrules.conf, monitors*.conf, keyboard-*.conf)
# are read any more, so all of that is now templated straight into the Lua file below.
- name: "HYDE | Detect system: VM or Host"
  ansible.builtin.shell: systemd-detect-virt
  register: virt_type
  changed_when: false
  ignore_errors: yes

- name: "HYDE | Render hyprland.lua (monitors, keyboard, window rules, autostart)"
  ansible.builtin.template:
    src: "hyprland.lua.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/hyprland.lua"
    mode: "0644"
  notify: Reload HyDE theme state

# CONFIGURE USER PREFERENCES
#######################################################################################

- name: "HYDE | Ensure zsh directory structure exists"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ ansible_facts.user_dir }}/.config"
    - "{{ ansible_facts.user_dir }}/.config/zsh"

- name: "HYDE | Create symbolic link for user preferences"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "{{ role_path }}/files/hypridle.conf", dest: "{{ ansible_facts.user_dir }}/.config/hypr/hypridle.conf" }
    - { src: "{{ role_path }}/files/kitty.conf", dest: "{{ ansible_facts.user_dir }}/.config/kitty/kitty.conf" }
    - { src: "{{ role_path }}/files/user.zsh", dest: "{{ ansible_facts.user_dir }}/.config/zsh/user.zsh" }

# Change some environment variables
# HyDE moved these out of ~/.config/hypr/hyde.conf (also retired by the Lua
# migration) into the [app] table of ~/.config/hyde/config.toml.
- name: "HYDE | Ensure hyde config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/hyde"
    mode: "0755"
    state: directory

- name: "HYDE | Set default editor/browser in hyde config.toml"
  community.general.ini_file:
    path: "{{ ansible_facts.user_dir }}/.config/hyde/config.toml"
    section: app
    option: "{{ item.option }}"
    value: '"{{ item.value }}"'
    mode: "0644"
  loop:
    - { option: "editor", value: "code" }
    - { option: "browser", value: "google-chrome-stable" }

- name: "HYDE | Remove some fastfecth logos"
  ansible.builtin.file:
   path: "{{ ansible_facts.user_dir }}/.config/fastfetch/logo/{{ item }}"
   state: absent
  loop:
    - "aisaka.icon"
    - "loli.icon"
    - "pochita.icon"
    - "geass.icon"

- name: "HYDE | Copy new fastfetch icons"
  become_user: yes
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_facts.user_dir }}/.config/fastfetch/logo/{{ item | basename }}"
    mode: '0644'
  with_fileglob:
    - "{{ role_path }}/files/fastfetch_icons/*"
