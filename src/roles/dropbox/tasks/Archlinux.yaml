---
# On Omarchy, use the CLI wrapper — it also installs dropbox-cli, libappindicator-gtk3,
# python-gpgme and nautilus-dropbox, and wires up the systemd service.
# script -qec gives the wrapper's internal sudo call a tty to read the primed
# ticket from — see the google-chrome role for the full explanation.
- name: "DROPBOX | Install via Omarchy CLI"
  ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && omarchy-install-dropbox' /dev/null"
  args:
    creates: /usr/bin/dropbox
  when: omarchy_mode | default(false)
  no_log: true

- name: "DROPBOX | install"
  ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && yay -S --needed --noconfirm --answerclean None --answerdiff None --answeredit None dropbox' /dev/null"
  when: not (omarchy_mode | default(false))
  no_log: true

