---
# go itself comes from mise; these are the build deps `go install` / cgo need.
- name: "GO | Install dependencies"
  become: true
  apt:
    name: "{{ item }}"
    state: present
  loop:
      - 'curl'
      - 'gcc'
      - 'git'
      - 'findutils'
      - 'make'
      - 'rsync'
      - 'tar'
  register: apt_result
  until: apt_result is success
  retries: 1
  delay: 2

- name: "GO | Install via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [go]
