---
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true


# install Go Packages
# omarchy_mode: go comes from mise (see Archlinux.yaml), and its binary isn't
# on PATH for a non-interactive shell like Ansible's command module runs —
# mise only exposes it via `mise activate` (shell rc) or its shims dir, neither
# of which applies here (confirmed on the test VM: a bare `env -i ... bash -c
# "go install ..."` can't find `go` at all). `mise exec --` resolves the
# mise-managed toolchain directly, no PATH/activation needed — verified the
# same minimal env succeeds through it instead.
# `mise exec` also sets its own GOBIN pointing inside the mise toolchain dir
# (~/.local/share/mise/installs/go/<ver>/bin), not ~/go/bin — confirmed on the
# VM the installed binary lands there instead of ~/go/bin, which the `creates`
# check and .zshrc's PATH both expect. Force GOBIN back to ~/go/bin so the
# installed binary ends up in the same place regardless of how go itself was
# provisioned (mise or pacman).
- name: GO | Install Golang Packages (omarchy_mode, via mise)
  ansible.builtin.command:
    cmd: "mise exec -- go install {{ item.package }}"
    creates: "~/go/bin/{{ item.cmd }}"
  environment:
    GOBIN: "{{ ansible_facts.user_dir }}/go/bin"
  register: go_install_mise
  changed_when: go_install_mise.rc != 0
  loop_control:
    label: "{{ item.package }}"
  loop: "{{ go.packages }}"
  when: go.packages is defined and (omarchy_mode | default(false))

- name: GO | Install Golang Packages
  ansible.builtin.command:
    cmd: "go install {{ item.package }}"
    creates: "~/go/bin/{{ item.cmd }}"
  register: go_install
  changed_when: go_install.rc != 0
  loop_control:
    label: "{{ item.package }}"
  loop: "{{ go.packages }}"
  when: go.packages is defined and not (omarchy_mode | default(false))