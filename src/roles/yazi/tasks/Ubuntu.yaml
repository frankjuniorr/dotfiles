---
# yazi, glow and ripgrep come from mise (the Charm apt repo is no longer needed);
# the preview deps below are system packages and stay on apt.
- name: "YAZI | Install yazi, glow, ripgrep via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [yazi, glow, ripgrep]

- name: "YAZI | Install preview dependencies"
  become: yes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - 7zip
    - poppler-utils
