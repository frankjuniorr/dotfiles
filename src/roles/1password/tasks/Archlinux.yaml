---
# Omarchy ships the 1Password GUI in the base ISO but NOT the CLI (`op`), which the
# git/dotfiles roles need for `op read` — install it explicitly (1password-cli is
# in the omarchy repo, so no AUR). Non-Omarchy hosts get both via the block below.
- name: "1PASSWORD | Install 1password-cli (op) via Omarchy CLI"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/omarchy_pkg.yml"
  vars:
    omarchy_pkg_names: [1password-cli]

- name: "1PASSWORD | Install on Arch Linux"
  when: not (omarchy_mode | default(false))
  block:
    - name: "1PASSWORD | Dependencies"
      become: true
      community.general.pacman:
        name: xdg-desktop-portal-gtk
        state: present

    # this 2 tasks, is same thing to import the GPG key, with this command:
    # 'curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --import'
    # This is necessary as a pre-requirements to 1password-cli works
    # see more: https://support.1password.com/install-linux/#arch-linux
    - name: "1PASSWORD | Download 1Password GPG key"
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/keys/1password.asc
        dest: /tmp/1password.asc
        mode: '0644'

    - name: "1PASSWORD | Import 1Password GPG key"
      ansible.builtin.command: gpg --import /tmp/1password.asc
      args:
        creates: "{{ ansible_facts.env.HOME }}/.gnupg/pubring.kbx"

    # script -qec gives yay's internal sudo call a tty to read the primed ticket
    # from — see the google-chrome role for the full explanation.
    - name: "1PASSWORD | install"
      ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && yay -S --needed --noconfirm --answerclean None --answerdiff None --answeredit None {{ item }}' /dev/null"
      loop:
        - "1password"
        - "1password-cli"
      no_log: true
