---
# neovim itself comes from mise (replaces the /opt tarball + /usr/local/bin symlink).
# curl/git stay on apt (needed by plugin managers), xclip is a clipboard provider.
- name: "NEOVIM | Install dependencies"
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - git
    - xclip

- name: "NEOVIM | Install via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [neovim]
