---
# `configs` is intrinsically tagged on this dispatcher (not just inherited via
# apply) because sesh's config symlink lives inside the distro-specific task
# file, mixed with the install steps — the include must stay reachable under
# --tags configs so that per-task filtering inside Archlinux/Ubuntu.yaml works.
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true
  tags: [configs]

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true
  tags: [configs]