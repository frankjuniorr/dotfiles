---
- name: "System | Checking for Distribution Config: {{ ansible_facts.distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts.distribution }}.yaml"
  register: system_distribution_config
  no_log: true

- name: "System | Run Tasks: {{ ansible_facts.distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yaml"
  when: system_distribution_config.stat.exists
  no_log: true

- name: "SOLAAR | Refresh {{ ansible_facts.user_dir }}/.config/solaar folder"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/solaar"
    state: absent
  tags: [configs]

- name: "Solaar | Ensure solaar directory structure exists"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ ansible_facts.user_dir }}/.config"
    - "{{ ansible_facts.user_dir }}/.config/solaar"
  tags: [configs]

- name: "Solaar | Symlink config.yaml"
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.yaml"
    dest: "{{ ansible_facts.user_dir }}/.config/solaar/config.yaml"
    state: link
    force: yes
  tags: [configs]

# Templated (not symlinked) so the Screen Capture key binding can switch between
# flameshot and Omarchy's own capture tool depending on omarchy_mode.
- name: "Solaar | Render rules.yaml"
  ansible.builtin.template:
    src: "rules.yaml.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/solaar/rules.yaml"
    mode: "0644"
  tags: [configs]
