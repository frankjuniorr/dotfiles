---
# script -qec gives yay's internal sudo call a tty to read the primed ticket
# from — see the google-chrome role for the full explanation.
- name: "INSYNC | install"
  ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && yay -S --needed --noconfirm --answerclean None --answerdiff None --answeredit None insync' /dev/null"
  when: not (omarchy_mode | default(false))
  no_log: true

# NOTE: unlike our own yay -S calls, omarchy-pkg-aur-add does not pass
# --answerclean/--answerdiff/--answeredit, so it could in principle hang on a
# package whose PKGBUILD triggers one of yay's interactive prompts — flagged,
# not expected to bite insync (a plain prebuilt binary package).
- name: "INSYNC | install via Omarchy CLI"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/omarchy_pkg.yml"
  vars:
    omarchy_pkg_names: [insync]
    omarchy_pkg_aur: true

- name: "INSYNC | start service"
  become: true
  ansible.builtin.systemd:
    name: "insync@{{ host_user }}"
    state: started
    enabled: yes
    scope: system  # Para serviços do sistema (remova se for `--user`)