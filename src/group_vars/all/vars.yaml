---

# Default local Installations paths
primary_installation_path: "{{ ansible_facts.user_dir }}/.local/bin"
scripts_installation_path: "{{ ansible_facts.user_dir }}/.bin"

# Git identity — not sensitive (already public in every commit), so it lives
# here rather than in vault.yml or being fetched from 1Password at runtime.
github_email: "frankcbjunior@gmail.com"

cli_roles:
  - system-base
  - 1password
  - git
  - mise
  - fzf
  - atuin
  - bat
  - zoxide
  - eza
  - btop
  - fetchs
  - just
  - fd
  - yazi
  - sesh
  - navi
  - neovim
  - starship
  - zsh
  - tmux
  - docker
  - terraform
  - go
  - kubernetes
  - dotfiles

gui_roles:
  - fonts
  - terminal
  - solaar
  - funny-apps
  - split-keyboard
  - dropbox
  - insync
  - vscode
  - google-chrome
  - telegram
  - spotify
  - obsidian
  - omarchy

default_roles:
  - system-base
  - mise          # tool installer; MUST precede every role that installs via mise (git included: gh)
  - 1password     # password manager
  - git

  # CLI Tools
  - fzf
  - atuin
  - bat
  - zoxide
  - eza
  - btop
  - fetchs
  - just
  - fd
  - yazi
  - sesh
  - navi
  - neovim

  # Terminal
  - fonts
  - starship
  - terminal
  - zsh
  - tmux

  # utilities to connect Logitech devices
  - solaar
  - funny-apps

  # Vial (split keyboard configurator)
  - split-keyboard

  # Devops tools
  - docker
  - terraform
  - go

  # Kubernetes tools
  - kubernetes

  # GUI softwares
  - dropbox
  - insync
  - vscode
  - google-chrome
  - telegram
  - spotify
  - obsidian

  # Desktop customization (needs Chrome + Ghostty installed above; Ubuntu/GNOME only)
  - gnome

  # Environment
  - dotfiles
  - omarchy     # Omarchy-specific setup — no-op unless omarchy_mode is true

go:
  packages:
    - package: github.com/spf13/cobra-cli@latest
      cmd: cobra-cli

# Fallback only (Ubuntu releases whose apt has no ghostty, e.g. 24.04): .deb from
# github.com/mkasberg/ghostty-ubuntu. This is the
# release tag; the asset is ghostty_<tag with "-ppa" -> ".ppa">_<arch>_<ubuntu>.deb
ghostty_ubuntu_version: "1.3.1-0-ppa2"

nerd_fonts_version: "v3.5.1"

# fonts list used by me
fonts_list:
  - "https://github.com/ryanoasis/nerd-fonts/raw/master/patched-fonts/DroidSansMono/DroidSansMNerdFont-Regular.otf"
