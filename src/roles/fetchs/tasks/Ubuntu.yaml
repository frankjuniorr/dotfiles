---
# onefetch and fastfetch are in the mise registry (priority: mise > apt > GitHub
# releases), which replaces the o2sh PPA and the fastfetch GitHub .deb download.
- name: "FETCHS | Install onefetch and fastfetch via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [onefetch, fastfetch]
