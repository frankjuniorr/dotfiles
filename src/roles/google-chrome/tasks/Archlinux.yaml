---
# On Omarchy, the `omarchy` role handles the Chromium -> Chrome swap via
# omarchy-remove-browser/omarchy-install-browser, which also fixes xdg-settings and .desktop files.
# yay's own internal `sudo pacman -U` needs a real tty to prompt for a password —
# Ansible detaches shell/command tasks from any controlling tty, so a bare `sudo`
# call inside a wrapped command always fails with "a password is required", no
# matter how recently sudo -v was run beforehand (that ticket lives on a
# different tty and isn't visible here). `script` allocates a pty for the whole
# wrapped command so the prime (piped in via stdin) and the later privileged use
# share the same tty — same technique Omarchy's own omarchy-update script uses.
- name: "GOOGLE CHROME | install"
  ansible.builtin.shell: "script -qec 'echo {{ ansible_become_pass }} | sudo -S -v >/dev/null 2>&1 && yay -S --needed --noconfirm google-chrome' /dev/null"
  when: not (omarchy_mode | default(false))
  no_log: true