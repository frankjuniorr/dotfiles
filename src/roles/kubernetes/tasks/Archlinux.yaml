---
# kubectl, helm, k9s, kubecolor come from mise on every host (replaces pacman /
# omarchy-pkg-add / GitHub-release download of kubecolor).
- name: "KUBERNETES | Install kubectl, helm, k9s, kubecolor via mise"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/mise_tool.yml"
  vars:
    mise_tools: [kubectl, helm, k9s, kubecolor]
