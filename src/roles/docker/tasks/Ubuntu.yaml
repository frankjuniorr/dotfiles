---
# These steps are based on the official Docker documentation: https://docs.docker.com/engine/install/ubuntu/#installation-methods
- name: "Docker | Update APT cache"
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: "Docker | Install dependencies"
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

# apt-key is gone on Ubuntu 26.04: deb822_repository fetches/stores the key itself.
- name: "Docker | Install python3-debian (for deb822_repository)"
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: "Docker | Add Docker's stable repository"
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: "Docker | Install Docker Engine"
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "LAZYDOCKER | Install"
  ansible.builtin.shell: "curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash"